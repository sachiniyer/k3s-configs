apiVersion: v1
kind: Service
metadata:
  labels:
    run: nginx
  name: schwinn-service
  namespace: schwinn
spec:
  ports:
  - name: web
    port: 80
    protocol: TCP
    targetPort: 80
  - name: sync
    port: 90
    protocol: TCP
    targetPort: 90
  selector:
    app: schwinn
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
