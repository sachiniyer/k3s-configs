apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: schwinn-cert
  namespace: schwinn
spec:
  commonName: schwinn.sachiniyer.com
  secretName: schwinn-cert
  dnsNames:
    - schwinn.sachiniyer.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect
  namespace: schwinn
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schwinn-ingress
  namespace: schwinn
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: schwinn-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: schwinn.sachiniyer.com
    http:
      paths:
      - path: /sync
        pathType: Prefix
        backend:
          service:
            name: schwinn-service
            port:
              number: 90
      - path: /
        pathType: Prefix
        backend:
          service:
            name: schwinn-service
            port:
              number: 80
  tls:
  - secretName: schwinn-cert
