---
# Points External Secrets Operator at AWS SSM Parameter Store.
# Reader identity: IAM user `cluster-external-secrets`, restricted to /cluster/* (read-only).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-ssm-creds
            key: access-key-id
            namespace: external-secrets
          secretAccessKeySecretRef:
            name: aws-ssm-creds
            key: secret-access-key
            namespace: external-secrets
