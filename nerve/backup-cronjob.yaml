---
# Daily nerve backup -> S3 (sachiniyer-cluster-backups, SSE-AES256, 30d lifecycle).
#
# Runs in the nerve ns so it can mount the RWO PVCs; podAffinity co-locates it on
# the same node as the nerve pod (RWO = one node at a time). Creds come from the
# cluster-backup-aws Secret (scoped IAM user, S3 write to the one bucket only),
# which is NOT committed to git — copy it in from the bitwarden ns, see README.
#
# Four volumes, four different reasons:
#   data/      conversation history, sessions, memu.sqlite, and config.local.yaml
#              (which holds the generated gateway jwt_secret). Not recoverable
#              from anywhere else.
#   tools/     CLI credentials and artifacts. Losing these means redoing the
#              interactive Proton Bridge / Gmail logins.
#   workspace/ soul, skills, crons, MEMORY.md. The workspace-push sidecar now
#              commits the agent's own writes back to git, so this is no longer
#              the only copy — it is the one that survives a bad push.
#   proton/    Proton Bridge's login: vault.enc, imap-sync, and the pass/GPG
#              keychain. ~70 KB. NOT the message cache — see below.
#
# Three things this job gets right on purpose. Each was a real failure:
#
#   * SQLite is SNAPSHOTTED, not copied. nerve.db runs in WAL mode, and on
#     2026-09-23 the main file had not been written in two days — everything
#     since lived in the -wal. `aws s3 sync` copies the db and its wal at
#     different moments, which restores as either stale or corrupt. The
#     `snapshot` initContainer uses SQLite's online backup API instead:
#     a consistent point-in-time copy, integrity-checked, WAL folded in.
#
#   * aws never sees a socket. `aws s3 sync` EXITS 2 when it skips a file it
#     cannot copy, and gpg-agent keeps Unix sockets in .gnupg/ while it runs.
#     Under `set -e` that failed every run from 2026-09-21 onward — after
#     uploading everything else, so the data was there but the job was red.
#     `--exclude` does NOT help: aws warns about special files while walking
#     the tree, before it applies filters. So the initContainer stages
#     Proton's REGULAR files into /snap/proton and aws uploads only that.
#
#   * Bridge's message cache (gluon/) is excluded. It is several GB, Bridge
#     re-syncs it from Proton's servers after a restore, and uploading it to a
#     fresh dated prefix every night made each run take ~20 minutes for data
#     nobody would restore.
#
# Two volumes are deliberately NOT backed up:
#   nerve-claude  the Agent SDK's .jsonl transcripts. A cache in a vendored
#                 CLI's own format; nerve.db already holds the readable copy of
#                 every message. Losing it costs the in-flight conversations
#                 their resume context, nothing more.
#   signal-data   signal-cli's account keys and ratchet state. Restoring a
#                 stale copy of this is worse than having none — it desyncs the
#                 session ratchet with everyone you talk to. Recovery is
#                 re-linking the device from the phone, which is by design.
#
# Scheduled at 04:47 to avoid the other backup jobs (vaultwarden 04:17,
# headscale 04:30, ssm Sundays 05:00).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nerve-backup
  namespace: nerve
spec:
  schedule: "47 4 * * *"
  # Explicit, because the default is NOT UTC — it is whatever timezone the
  # kube-controller-manager runs in. Verified empirically on 2026-09-20: a
  # "47 4" schedule fired at 08:47Z, i.e. the controller is on UTC-4 (Eastern).
  # Every other CronJob in this cluster (vaultwarden 04:17, ssm 05:00,
  # upgrade-check) inherits that same implicit Eastern schedule and is
  # therefore running 3 hours off from local time. Pinning it here means this
  # job's schedule survives the controller's timezone changing under it.
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: nerve
                  topologyKey: kubernetes.io/hostname
          initContainers:
            - name: snapshot
              image: python:3.13-slim
              command: ["python3", "-c"]
              args:
                - |
                  import glob, os, shutil, sqlite3, stat, sys

                  # 1. SQLite: consistent point-in-time copies, WAL folded in.
                  os.makedirs("/snap/data", exist_ok=True)
                  bad = 0
                  for path in sorted(glob.glob("/data/*.db") + glob.glob("/data/*.sqlite")):
                      name = os.path.basename(path)
                      dst = os.path.join("/snap/data", name)
                      src = sqlite3.connect(path, timeout=60)
                      out = sqlite3.connect(dst)
                      src.backup(out)
                      out.execute("pragma journal_mode=delete")
                      ok = out.execute("pragma integrity_check").fetchone()[0]
                      out.close(); src.close()
                      print(f"snapshot {name}: {os.path.getsize(dst)} bytes, integrity={ok}")
                      bad += ok != "ok"

                  # 2. Proton: regular files only, minus what is not worth
                  #    restoring. Sockets are skipped HERE because aws cannot
                  #    be told to ignore them (see the header).
                  # Prefix match on "updates": the PVC also holds
                  # updates-3.26.0.broken, a crashing self-update set aside
                  # during an earlier incident — ~1,500 Qt files, and the one
                  # thing that must never be restored.
                  SKIP_DIRS = {"gluon", "logs", "lost+found"}
                  staged = 0
                  for root, dirs, files in os.walk("/proton"):
                      dirs[:] = [d for d in dirs
                                 if d not in SKIP_DIRS and not d.startswith("updates")]
                      for f in files:
                          p = os.path.join(root, f)
                          if not stat.S_ISREG(os.lstat(p).st_mode):
                              continue
                          dst = os.path.join("/snap/proton", os.path.relpath(p, "/proton"))
                          os.makedirs(os.path.dirname(dst), exist_ok=True)
                          shutil.copy2(p, dst)
                          staged += 1
                  print(f"staged {staged} proton files")
                  if not os.path.exists("/snap/proton/.config/protonmail/bridge-v3/vault.enc"):
                      print("ERROR: no Bridge vault staged — the login would not survive a restore")
                      bad += 1
                  sys.exit(1 if bad else 0)
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: proton
                  mountPath: /proton
                  readOnly: true
                - name: snap
                  mountPath: /snap
          containers:
            - name: backup
              image: amazon/aws-cli:2.15.30
              # The aws-cli image has no tar, so back up file-level with
              # `aws s3 sync` to a dated prefix. SQLite WAL/SHM files are
              # included so a restore is consistent.
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  ts=$(date +%F)
                  base="s3://sachiniyer-cluster-backups/nerve/${ts}"
                  # Live databases are excluded here and uploaded from /snap,
                  # where the initContainer left consistent copies.
                  aws s3 sync /data "${base}/data/" --sse AES256 \
                    --exclude "lost+found/*" --exclude "cache/*" --exclude "logs/*" \
                    --exclude "*.db" --exclude "*.db-wal" --exclude "*.db-shm" \
                    --exclude "*.sqlite" --exclude "*.sqlite-wal" --exclude "*.sqlite-shm"
                  aws s3 sync /snap/data "${base}/data/" --sse AES256
                  aws s3 sync /tools "${base}/tools/" --sse AES256 \
                    --exclude "lost+found/*" --exclude ".cache/*"
                  aws s3 sync /workspace "${base}/workspace/" --sse AES256 \
                    --exclude "lost+found/*" --exclude ".git/*"
                  # Proton Bridge: the login only (vault, imap-sync, pass/GPG),
                  # staged by the initContainer — never /proton directly.
                  aws s3 sync /snap/proton "${base}/proton/" --sse AES256
                  echo "nerve backup complete: ${ts}"
              envFrom:
                - secretRef:
                    name: cluster-backup-aws
              env:
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: workspace
                  mountPath: /workspace
                  readOnly: true
                - name: snap
                  mountPath: /snap
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: nerve-data
                # NOT readOnly at the volume: reading a WAL-mode SQLite db
                # needs write access to its -shm. Only the snapshot
                # initContainer mounts it writable; the upload mounts it ro.
            - name: snap
              emptyDir: {}
            - name: tools
              persistentVolumeClaim:
                claimName: nerve-tools
                readOnly: true
            - name: workspace
              persistentVolumeClaim:
                claimName: nerve-workspace
                readOnly: true
            - name: proton
              persistentVolumeClaim:
                claimName: proton-data
                readOnly: true
