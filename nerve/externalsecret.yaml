---
# Secrets live in AWS SSM Parameter Store under /cluster/nerve/ and are synced into the cluster
# by External Secrets Operator. NOTHING secret is stored in this repo or on any laptop.
#
# Rotate:   aws ssm put-parameter --name /cluster/nerve/<KEY> --value <new> --type SecureString --overwrite
# History:  aws ssm get-parameter-history --name /cluster/nerve/<KEY>      (SSM versions every write)
# Force sync: kubectl -n nerve annotate externalsecret nerve-secrets force-sync=$(date +%s) --overwrite
#
# Never pass a secret as a shell argument — see external-secrets/README.md for
# the --cli-input-json recipe.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nerve-secrets
  namespace: nerve
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: nerve-secrets
    creationPolicy: Owner
  data:
    # Model access via the Claude subscription. Minted with `claude setup-token`
    # (long-lived, roughly a year). The Claude Agent SDK reads this env var
    # natively, so no proxy or token shim is involved. See PLAN.md §8.
    #
    # Swapping to pay-per-token billing later is a one-line change: put an
    # ANTHROPIC_API_KEY here instead and change the env name in deployment.yaml.
    # The SDK prefers ANTHROPIC_API_KEY when both are set.
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: /cluster/nerve/CLAUDE_CODE_OAUTH_TOKEN
    # SSH deploy key for cloning the private workspace repo. Read-only and
    # scoped to sachiniyer/nerve-workspace alone — it cannot reach any other
    # repo, which a personal access token could.
    - secretKey: WORKSPACE_DEPLOY_KEY
      remoteRef:
        key: /cluster/nerve/WORKSPACE_DEPLOY_KEY
    # Encrypts gog's file-backed keyring, where the Gmail/Calendar OAuth
    # refresh tokens live. The file backend needs this in any non-interactive
    # context — without it an interactive login appears to work and then every
    # cron job silently fails to read the token. Randomly generated; it is not
    # a password anyone types.
    - secretKey: GOG_KEYRING_PASSWORD
      remoteRef:
        key: /cluster/nerve/GOG_KEYRING_PASSWORD
    # --- Phase 2: uncomment as each lands ---
    # - secretKey: GOOGLE_OAUTH_REFRESH_TOKEN
    #   remoteRef:
    #     key: /cluster/nerve/GOOGLE_OAUTH_REFRESH_TOKEN
    # REMOVED 2026-09-20: MEMU_ANTHROPIC_API_KEY. Do not add it, or any other
    # Anthropic API key, back.
    #
    # It existed so memU could make raw API calls, and it was deliberately not
    # named ANTHROPIC_API_KEY so the SDK would not pick it up. That was not
    # enough. nerve reads it out of config in _build_env and injects it as
    # ANTHROPIC_API_KEY into the Claude Code SUBPROCESS, which prefers it over
    # CLAUDE_CODE_OAUTH_TOKEN — so the whole agent ran on pay-per-token billing
    # and burned $15 of credits in a day. The container's own env was clean the
    # entire time, which is why it went unnoticed.
    #
    # memU is now disabled. Memory is the workspace `memory` skill plus the
    # transcripts reader, and neither needs a credential. The fork refuses the
    # injection and selfcheck fails the rollout if a key comes back.
    # Apple app-specific password for iCloud CalDAV. NOT his Apple ID
    # password — Apple refuses that for third-party clients. Revocable on its
    # own at appleid.apple.com. Note it also grants Contacts and Reminders
    # over CardDAV, so it is broader than calendar alone.
    - secretKey: ICLOUD_APP_PASSWORD
      remoteRef:
        key: /cluster/nerve/ICLOUD_APP_PASSWORD
    # Read-only .ics share link for Proton Calendar. A secret: the URL embeds
    # a PassphraseKey, so anyone holding it can read the calendar.
    - secretKey: PROTON_CALENDAR_ICS_URL
      remoteRef:
        key: /cluster/nerve/PROTON_CALENDAR_ICS_URL
    # SSH deploy key with WRITE access to sachiniyer/nerve ONLY — a GitHub
    # deploy key cannot reach any other repo. The agent's nerve-update skill
    # uses it to push weekly rebases to `rebase/<date>` and then `signal`.
    # Mounted as a file (0400), never an env var. Revoke under the fork's
    # Settings → Deploy keys ("nerve-agent (k3s)").
    - secretKey: NERVE_FORK_DEPLOY_KEY
      remoteRef:
        key: /cluster/nerve/NERVE_FORK_DEPLOY_KEY
    # Bridge-GENERATED IMAP password, not the Proton account password.
    - secretKey: PROTON_BRIDGE_PASSWORD
      remoteRef:
        key: /cluster/nerve/PROTON_BRIDGE_PASSWORD
