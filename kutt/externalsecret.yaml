---
# Secrets live in AWS SSM Parameter Store under /cluster/kutt/ and are synced into the cluster
# by External Secrets Operator. NOTHING secret is stored in this repo or on any laptop.
#
# Rotate:   aws ssm put-parameter --name /cluster/kutt/<KEY> --value <new> --type SecureString --overwrite
# History:  aws ssm get-parameter-history --name /cluster/kutt/<KEY>      (SSM versions every write)
# Force sync: kubectl -n kutt annotate externalsecret kutt-secrets force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kutt-secrets
  namespace: kutt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: kutt-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: /cluster/kutt/JWT_SECRET
