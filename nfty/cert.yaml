---
# ntfy TLS cert. Uses DNS-01 (letsencrypt-prod-dns) because nfty.sachiniyer.com
# is not in the public nginx.conf map (resolves to the wildcard/mesh IP), so
# HTTP-01 validation cannot reach it. DNS-01 validates via a Route53 TXT record
# and works regardless of public HTTP routing.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nfty-cert
  namespace: nfty
spec:
  commonName: nfty.sachiniyer.com
  secretName: nfty-cert
  dnsNames:
    - nfty.sachiniyer.com
  issuerRef:
    name: letsencrypt-prod-dns
    kind: ClusterIssuer
