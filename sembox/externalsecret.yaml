---
# Secrets live in AWS SSM Parameter Store under /cluster/sembox/ and are synced into the cluster
# by External Secrets Operator. NOTHING secret is stored in this repo or on any laptop.
#
# Rotate:   aws ssm put-parameter --name /cluster/sembox/<KEY> --value <new> --type SecureString --overwrite
# History:  aws ssm get-parameter-history --name /cluster/sembox/<KEY>      (SSM versions every write)
# Force sync: kubectl -n sembox annotate externalsecret sembox-secrets force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sembox-secrets
  namespace: sembox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: sembox-secrets
    creationPolicy: Owner
  data:
    - secretKey: DBPASSWORD
      remoteRef:
        key: /cluster/sembox/DBPASSWORD
    - secretKey: NEW_POSTGRES_PASSWORD
      remoteRef:
        key: /cluster/sembox/NEW_POSTGRES_PASSWORD
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /cluster/sembox/POSTGRES_PASSWORD
