apiVersion: apps/v1
kind: Deployment
metadata:
  name: sembox-db
  namespace: sembox
spec:
  selector:
    matchLabels:
      app: sembox-db
  template:
    metadata:
      labels:
        app: sembox-db
    spec:
      containers:
        - name: sembox-db
          image: sachiyer/sembox-db:v4
          ports:
            - containerPort: 5432
              name: db-port
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sembox-secrets
                  key: POSTGRES_PASSWORD
            - name: NEW_POSTGRES_USER
              value: sem
            - name: NEW_POSTGRES_DB
              value: semdb
            - name: NEW_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sembox-secrets
                  key: NEW_POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: sembox-db
  namespace: sembox
spec:
  selector:
    app: sembox-db
  ports:
    - name: db-port
      protocol: TCP
      port: 5432
      targetPort: db-port
  type: ClusterIP
