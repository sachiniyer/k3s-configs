---
# Secrets live in AWS SSM Parameter Store under /cluster/invoice/ and are synced into the cluster
# by External Secrets Operator. NOTHING secret is stored in this repo or on any laptop.
#
# Rotate:   aws ssm put-parameter --name /cluster/invoice/<KEY> --value <new> --type SecureString --overwrite
# History:  aws ssm get-parameter-history --name /cluster/invoice/<KEY>      (SSM versions every write)
# Force sync: kubectl -n invoice annotate externalsecret invoice-secrets force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoice-secrets
  namespace: invoice
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: invoice-secrets
    creationPolicy: Owner
  data:
    - secretKey: AWS_API_KEY
      remoteRef:
        key: /cluster/invoice/AWS_API_KEY
    - secretKey: AWS_API_SECRET
      remoteRef:
        key: /cluster/invoice/AWS_API_SECRET
    - secretKey: JWT_KEY
      remoteRef:
        key: /cluster/invoice/JWT_KEY
    - secretKey: REACT_APP_TOKEN_COOKIE
      remoteRef:
        key: /cluster/invoice/REACT_APP_TOKEN_COOKIE
    - secretKey: SALT
      remoteRef:
        key: /cluster/invoice/SALT
    - secretKey: SECRET_KEY
      remoteRef:
        key: /cluster/invoice/SECRET_KEY
