---
# Secrets live in AWS SSM Parameter Store under /cluster/crabfit/ and are synced into the cluster
# by External Secrets Operator. NOTHING secret is stored in this repo or on any laptop.
#
# Rotate:   aws ssm put-parameter --name /cluster/crabfit/<KEY> --value <new> --type SecureString --overwrite
# History:  aws ssm get-parameter-history --name /cluster/crabfit/<KEY>      (SSM versions every write)
# Force sync: kubectl -n crabfit annotate externalsecret crabfit-secrets force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crabfit-secrets
  namespace: crabfit
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: crabfit-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /cluster/crabfit/DATABASE_URL
    - secretKey: NEW_POSTGRES_PASSWORD
      remoteRef:
        key: /cluster/crabfit/NEW_POSTGRES_PASSWORD
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /cluster/crabfit/POSTGRES_PASSWORD
