---
# Secrets live in AWS SSM Parameter Store under /cluster/resow/ and are synced into the cluster
# by External Secrets Operator. NOTHING secret is stored in this repo or on any laptop.
#
# Rotate:   aws ssm put-parameter --name /cluster/resow/<KEY> --value <new> --type SecureString --overwrite
# History:  aws ssm get-parameter-history --name /cluster/resow/<KEY>      (SSM versions every write)
# Force sync: kubectl -n resow annotate externalsecret resow-secrets force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resow-secrets
  namespace: resow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: resow-secrets
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY
      remoteRef:
        key: /cluster/resow/AWS_ACCESS_KEY
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /cluster/resow/AWS_SECRET_ACCESS_KEY
    - secretKey: DB_PWORD
      remoteRef:
        key: /cluster/resow/DB_PWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: /cluster/resow/JWT_SECRET
