# resow backend. Secrets come from AWS SSM Parameter Store via
# External Secrets Operator (see resow/externalsecret.yaml + external-secrets/).
# Non-secret config stays inline so this file is the full source of truth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resow-back
  namespace: resow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resow-back
  template:
    metadata:
      labels:
        app: resow-back
    spec:
      containers:
        - name: resow-back
          image: sachiyer/resow-back
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DB_USER
              value: "resow"
            - name: DB_PWORD
              valueFrom:
                secretKeyRef:
                  name: resow-secrets
                  key: DB_PWORD
            - name: DB_HOST
              value: "mongo-mongodb.resow.svc.cluster.local"
            - name: DB_PORT
              value: "27017"
            - name: DB_NAME
              value: "resow"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_BUCKET_NAME
              value: "resow-devops-final"
            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: resow-secrets
                  key: AWS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: resow-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: resow-secrets
                  key: JWT_SECRET
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: resow-back
  namespace: resow
spec:
  selector:
    app: resow-back
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
