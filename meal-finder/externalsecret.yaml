---
# Secrets live in AWS SSM Parameter Store under /cluster/meal-finder/ and are synced into the cluster
# by External Secrets Operator. NOTHING secret is stored in this repo or on any laptop.
#
# Rotate:   aws ssm put-parameter --name /cluster/meal-finder/<KEY> --value <new> --type SecureString --overwrite
# History:  aws ssm get-parameter-history --name /cluster/meal-finder/<KEY>      (SSM versions every write)
# Force sync: kubectl -n meal-finder annotate externalsecret meal-finder-secrets force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meal-finder-secrets
  namespace: meal-finder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: meal-finder-secrets
    creationPolicy: Owner
  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: /cluster/meal-finder/API_TOKEN
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /cluster/meal-finder/AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /cluster/meal-finder/AWS_SECRET_ACCESS_KEY
    - secretKey: EXA_API_KEY
      remoteRef:
        key: /cluster/meal-finder/EXA_API_KEY
    - secretKey: GOOGLE_MAPS_API_KEY
      remoteRef:
        key: /cluster/meal-finder/GOOGLE_MAPS_API_KEY
    - secretKey: MONGODB_PASSWORD
      remoteRef:
        key: /cluster/meal-finder/MONGODB_PASSWORD
    - secretKey: MONGO_INITDB_ROOT_PASSWORD
      remoteRef:
        key: /cluster/meal-finder/MONGO_INITDB_ROOT_PASSWORD
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /cluster/meal-finder/OPENAI_API_KEY
    - secretKey: YELP_API_KEY
      remoteRef:
        key: /cluster/meal-finder/YELP_API_KEY
