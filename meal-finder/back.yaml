---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meal-finder-back
  namespace: meal-finder
spec:
  selector:
    matchLabels:
      app: meal-finder-back
  template:
    metadata:
      labels:
        app: meal-finder-back
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: meal-finder-back
          image: sachiyer/meal-finder-back:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MONGODB_DATABASE
              value: assistant_db
            - name: MONGODB_USER
              value: assistant_user
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meal-finder-secrets
                  key: MONGODB_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: meal-finder-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: meal-finder-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              value: "us-east-1"
            - name: MONGODB_HOST
              value: "mongodb.meal-finder.svc.cluster.local"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meal-finder-secrets
                  key: OPENAI_API_KEY
            - name: OPENAI_MODEL_ID
              value: "gpt-5.4-mini"
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meal-finder-secrets
                  key: GOOGLE_MAPS_API_KEY
            - name: GOOGLE_MAPS_ENDPOINT
              value: "https://maps.googleapis.com/maps/api/place/textsearch/json"
            - name: BEDROCK_MICRO_MODEL
              value: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
            - name: BEDROCK_PRO_MODEL
              value: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
            - name: YELP_CLIENT_ID
              value: "0Gd-Su6ABGw-1LkhXY_how"
            - name: YELP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meal-finder-secrets
                  key: YELP_API_KEY
            - name: EXA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meal-finder-secrets
                  key: EXA_API_KEY
            - name: LOG_LEVEL
              value: "INFO"
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: meal-finder-secrets
                  key: API_TOKEN

---
apiVersion: v1
kind: Service
metadata:
  name: meal-finder-back
  namespace: meal-finder
spec:
  selector:
    app: meal-finder-back
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors
  namespace: meal-finder
spec:
  headers:
    accessControlAllowMethods:
      - "GET"
      - "OPTIONS"
      - "PUT"
      - "POST"
      - "DELETE"
    accessControlAllowOriginList:
      - "meal-finder-api.sachiniyer.com"
      - "meals.sachiniyer.com"
      - "meal-finder-front.meal-finder.svc.cluster.local"
    accessControlMaxAge: 100
    addVaryHeader: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: meal-finder-back-cert
  namespace: meal-finder
spec:
  commonName: meal-finder-api.sachiniyer.com
  secretName: meal-finder-back-cert
  dnsNames:
    - meal-finder-api.sachiniyer.com
  issuerRef:
    name: letsencrypt-prod-dns
    kind: ClusterIssuer
---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: meal-finder-back-ingress
  namespace: meal-finder
spec:
  tls:
    - secretName: meal-finder-back-cert
  rules:
    - host: meal-finder-api.sachiniyer.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meal-finder-back
                port:
                  number: 80
