---
# headscale config, 0.23+ format. Ported from the pre-0.23 config on 2026-08-10.
# Paths are ABSOLUTE on purpose: the old relative paths (./db.sqlite, ./headscale.sock)
# meant the CLI only worked when run from /etc/headscale.
server_url: https://tunnel.sachiniyer.com:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

private_key_path: /etc/headscale/private.key
noise:
  private_key_path: /etc/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    stun_listen_addr: "0.0.0.0:3478"
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: false
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /etc/headscale/db.sqlite

log:
  format: text
  level: info

policy:
  mode: file
  path: ""

dns:
  magic_dns: true
  base_domain: mesh.sachiniyer.com
  nameservers:
    global:
      - 1.1.1.1
  search_domains: []
  extra_records: []

unix_socket: /etc/headscale/headscale.sock
unix_socket_permission: "0770"

# Restored 2026-08-10: headscale terminates TLS itself on :8080 because server_url is https.
# Dropping these made every client fail PollNetMap with a TLS/timeout error.
tls_cert_path: /etc/headscale/letsencrypt/fullchain.pem
tls_key_path: /etc/headscale/letsencrypt/privkey.pem
